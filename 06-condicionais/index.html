<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 18pt Arial;
        }

        input,
        button {
            font: normal 18pt Arial;
            width: 100px;
        }

        #resposta {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h1>Desconto de Loja</h1>
    <input type="number" id="valor">
    <input type="text" id="vip">
    <button id="verificar">Verificar</button>
    <div id="resposta"></div>

    <script>
        let valor = document.querySelector('#valor')
        let clienteVip = document.querySelector('#vip')
        let botaoVerificar = document.querySelector('#verificar')
        let resposta = document.querySelector('#resposta')

        // funcao 
        function verificarDesconto() {
            let n1 = Number(valor)
            if (clienteVip.value.toLowerCase() === 'sim' || n1.value > 200) {
                resposta.innerText = "Voce possui desconto."
            }
        }
        
        // evento
        botaoVerificar.addEventListener('click', verificarDesconto)
    </script>
</body>

</html>
