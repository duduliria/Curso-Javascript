<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 400px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .resposta {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            text-align: center;
            min-height: 25px;
        }
    </style>


</head>

<body>


    <div class="container">
        <h1>Calculadora de IMC</h1>

        <label>Nome:</label>
        <input id="nome" type="text" placeholder="Digite seu nome">

        <label>Peso (kg):</label>
        <input id="peso" type="number" placeholder="Ex.: 70">

        <label>Altura (m):</label>
        <input id="altura" step="0.01" placeholder="Ex.: 1.75">

        <button id="calcular">Calcular IMC</button>

        <div class="resposta" id="resposta">
            A resposta aparecerá aqui.
        </div>
    </div>

    <script>
        // aqui comeca o codigo
        let nome = document.querySelector('#nome')
        let peso = document.querySelector('#peso')
        let altura = document.querySelector('#altura')
        let botaoCalcularImc = document.querySelector('#calcular')
        let resposta = document.querySelector('#resposta')

        function calcularImc() {
            // conversao
            let pesoNumero = Number(peso.value)
            let alturaNumero = Number(altura.value)

            let calculoImc = (pesoNumero / (alturaNumero * alturaNumero)).toFixed(1)
            let mensagem = "Seu imc é de "

            if (calculoImc < 18.5) {
                resposta.innerText = mensagem + calculoImc + " - Abaixo do peso"
            } else if (calculoImc >= 18.5 && calculoImc <= 24.9) {
                resposta.innerText = mensagem + calculoImc + " - Peso Normal"
            } else if (imcalculoImc >= 25 && calculoImc <= 29.9) {
                resposta.innerText = mensagem + calculoImc + " - Excesso de peso"
            } else if (imcalculoImc >= 30 && calculoImc <= 34.9) {
                resposta.innerText = mensagem + calculoImc + " - Obesidade Grau 1"
            } else if (imcalculoImc >= 35 && calculoImc <= 39.9) {
                resposta.innerText = mensagem + calculoImc + " - Obesidade Grau 2"
            } else {
                resposta.innerText = mensagem + calculoImc + " - Obesidade Grau 3"
            }
        }

        botaoCalcularImc.addEventListener('click',calcularImc )
    </script>

</body>

</html>
